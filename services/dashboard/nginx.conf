# Serves the dashboard SPA. /api and /mcp never reach nginx: the Ingress routes those
# paths on the same host straight to the gateway Service (same origin -> no CORS needed).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths return index.html (e.g. /invite/<token>)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
