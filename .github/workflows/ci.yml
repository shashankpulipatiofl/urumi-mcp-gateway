name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Gateway tests
        working-directory: services/gateway
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q
      - name: WooCommerce MCP tests
        working-directory: services/woocommerce-mcp
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q

  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: services/dashboard/package-lock.json }
      - working-directory: services/dashboard
        run: npm ci && npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint + render + schema-validate both environments
        run: |
          helm dependency update deploy/helm/urumi-platform
          for env in local prod; do
            helm lint deploy/helm/urumi-platform -f deploy/helm/urumi-platform/values-$env.yaml
            helm template urumi deploy/helm/urumi-platform -n urumi -f deploy/helm/urumi-platform/values-$env.yaml > rendered-$env.yaml
          done
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary rendered-local.yaml rendered-prod.yaml

  images:
    # Build every image; push to GHCR on main and on version tags.
    needs: [test-python, build-dashboard, helm]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        image: [store, woocommerce-mcp, demo-upstreams, gateway, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/urumi-${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
