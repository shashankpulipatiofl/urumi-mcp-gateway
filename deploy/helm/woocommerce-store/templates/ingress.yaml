{{- if .Values.ingress.enabled }}
# Public storefront: http(s)://<store.host> -> WordPress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "store.fullname" . }}
  labels: {{- include "store.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.store.host | quote }}]
      secretName: {{ default (printf "%s-tls" (include "store.fullname" .)) .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.store.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "store.fullname" . }}-wordpress
                port: { name: http }
{{- end }}
