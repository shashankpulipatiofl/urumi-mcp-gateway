{{- if not .Values.secrets.existingSecret }}
# All credentials of this store. Generated once, then reused on every upgrade.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "store.fullname" . }}-secrets
  labels: {{- include "store.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # never delete the DB passwords together with the release
type: Opaque
data:
  mariadb-root-password: {{ include "store.secretValue" (dict "ctx" . "key" "mariadb-root-password") }}
  mariadb-password: {{ include "store.secretValue" (dict "ctx" . "key" "mariadb-password") }}
  wp-admin-password: {{ include "store.secretValue" (dict "ctx" . "key" "wp-admin-password" "value" .Values.secrets.adminPassword "length" 20) }}
  wc-consumer-key: {{ include "store.secretValue" (dict "ctx" . "key" "wc-consumer-key" "prefix" "ck_" "length" 40) }}
  wc-consumer-secret: {{ include "store.secretValue" (dict "ctx" . "key" "wc-consumer-secret" "prefix" "cs_" "length" 40) }}
  # Bearer token the gateway must present to this store's MCP server
  mcp-token: {{ include "store.secretValue" (dict "ctx" . "key" "mcp-token" "length" 48) }}
{{- end }}
