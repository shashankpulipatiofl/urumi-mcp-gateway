# Runs after every install/upgrade: installs WordPress, activates WooCommerce, enables
# Cash on Delivery and (re)creates the REST API key used by the MCP server. Idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "store.fullname" . }}-setup
  labels: {{- include "store.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "store.labels" . | nindent 8 }}
        app.kubernetes.io/component: setup
    spec:
      {{- include "store.podSecurity" . | nindent 6 }}
      restartPolicy: OnFailure
      # The WordPress volume is ReadWriteOnce: it can be mounted by several pods only on the
      # same node, so schedule this Job next to the WordPress pod.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {{- include "store.selector" (merge (dict "component" "wordpress") .) | nindent 18 }}
      securityContext:
        runAsUser: 33        # www-data, owner of the WordPress files in the image
        runAsGroup: 33
        runAsNonRoot: true
      containers:
        - name: setup
          image: "{{ .Values.images.store.repository }}:{{ .Values.images.store.tag }}"
          imagePullPolicy: {{ .Values.images.store.pullPolicy }}
          command: ["setup-store"]
          env:
            {{- include "store.wpEnv" . | nindent 12 }}
            - name: WP_CLI_CACHE_DIR
              value: /tmp/wp-cli-cache
            - name: WP_PATH
              value: /var/www/html
            - name: STORE_URL
              value: {{ include "store.url" . | quote }}
            - name: STORE_TITLE
              value: {{ .Values.store.title | quote }}
            - name: STORE_TIMEZONE
              value: {{ .Values.store.timezone | quote }}
            - name: STORE_CURRENCY
              value: {{ .Values.store.currency | quote }}
            - name: STORE_COUNTRY
              value: {{ .Values.store.country | quote }}
            - name: SEED_PRODUCTS
              value: {{ .Values.store.seedProducts | quote }}
            - name: WP_ADMIN_USER
              value: {{ .Values.store.adminUser | quote }}
            - name: WP_ADMIN_EMAIL
              value: {{ .Values.store.adminEmail | quote }}
            - name: WP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "store.secretName" . }}, key: wp-admin-password } }
            - name: WC_CONSUMER_KEY
              valueFrom: { secretKeyRef: { name: {{ include "store.secretName" . }}, key: wc-consumer-key } }
            - name: WC_CONSUMER_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "store.secretName" . }}, key: wc-consumer-secret } }
          resources: {{- toYaml .Values.resources.setup | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: html
              mountPath: /var/www/html
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: {{ include "store.fullname" . }}-wordpress
