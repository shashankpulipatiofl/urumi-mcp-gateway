# React dashboard served by a non-root nginx (static files only; no secrets in the browser bundle).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dashboard
  labels: {{- include "urumi.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "urumi.selector" (dict "root" . "component" "dashboard") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels: {{- include "urumi.selector" (dict "root" . "component" "dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "urumi.labels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      automountServiceAccountToken: false
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.dashboard.resources | nindent 12 }}
          {{- include "urumi.restrictedContainer" (dict "uid" 101) | nindent 10 }}
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
