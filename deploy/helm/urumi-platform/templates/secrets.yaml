{{- if not .Values.secrets.existingSecret }}
# Gateway + upstream credentials. Generated once, reused on upgrade, kept on uninstall.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-platform-secrets
  labels: {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  secret-key: {{ include "urumi.secretValue" (dict "ctx" . "key" "secret-key" "length" 64) }}          # signs sessions + chat tokens
  encryption-key: {{ include "urumi.secretValue" (dict "ctx" . "key" "encryption-key" "length" 64) }}  # encrypts upstream credentials at rest
  admin-password: {{ include "urumi.secretValue" (dict "ctx" . "key" "admin-password" "value" .Values.secrets.adminPassword "length" 20) }}
  postgres-password: {{ include "urumi.secretValue" (dict "ctx" . "key" "postgres-password" "length" 32) }}
  fx-api-key: {{ include "urumi.secretValue" (dict "ctx" . "key" "fx-api-key" "length" 40) }}          # credential of the fx-rates upstream
{{- end }}
